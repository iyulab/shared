name: Publish to npm

on:
  # Reusable workflow entrypoint for package repositories.
  workflow_call:
    inputs:
      node_version:
        description: Node.js version to use for the publish job.
        required: false
        type: string
        # 소비 리포들의 ci.yml 기준선(24)을 따라간다. 이 기본값이 기준선보다 낮으면,
        # node_version 을 명시하지 않는 새 소비자가 구버전으로 게시를 시도하게 된다.
        # 특히 22 는 lock-less install 경로에서 번들 npm 의 arborist 가
        # "Cannot read properties of null (reading 'edgesOut')" 로 크래시하는 버전이다.
        default: "24"
      verify_command:
        description: >-
          Optional shell command that checks the packed tarball before it is published.
          It runs from the repository root after the built-in entry-point check, with
          PACKED_DIR set to the extracted package root and PACKED_TARBALL to the .tgz
          that will be published. A non-zero exit stops the publish. The npm token is
          not in its environment.
        required: false
        type: string
        default: ""
    secrets:
      NPM_TOKEN:
        description: npm token used for publishing.
        required: true

# 이 워크플로가 GITHUB_TOKEN 을 쓰는 곳은 체크아웃뿐이다 — 레지스트리 인증은 NPM_TOKEN 이
# 하고, 어떤 스텝도 리포에 쓰지 않는다. 선언이 없으면 호출한 리포의 기본 권한을 그대로 받으므로
# 필요한 최소만 명시한다. 재사용 워크플로의 permissions 는 caller 가 가진 것을 넘어설 수 없고
# 좁히기만 하므로, 이 선언이 소비자의 다른 워크플로에 영향을 주지는 않는다.
permissions:
  contents: read

# 동일 패키지의 동시 publish를 방지한다(태그 재푸시 / 수동 dispatch 경쟁 차단).
concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    # caller job 은 timeout-minutes 를 선언할 수 없다 — 재사용 워크플로 호출 job 의 허용 키
    # 목록에 없어서 붙이면 Unexpected value 로 파싱이 깨진다. 즉 이 상한은 여기에만 존재할 수
    # 있고, 없으면 GitHub 기본값 6시간이 그대로 적용된다. 위 concurrency 그룹이 소비자 리포
    # 단위라, 행 걸린 run 하나가 그 패키지의 후속 게시를 그 6시간 동안 봉쇄한다.
    # 20 은 이 job 의 정상 소요보다 훨씬 크게 잡은 값이다 — 정확한 값보다 상한의 존재가 요점이다.
    timeout-minutes: 20

    steps:
      # Checkout the consumer repository that called this reusable workflow.
      - name: Checkout
        uses: actions/checkout@v5

      # Checkout shared helper scripts so the workflow logic stays thin.
      # NOTE: github.workflow_ref returns the *caller's* workflow path, not this
      # reusable workflow's path, so the repository is hardcoded to iyulab/shared.
      - name: Checkout shared assets
        uses: actions/checkout@v5
        with:
          repository: iyulab/shared
          path: .shared
          sparse-checkout: scripts/

      # Configure Node.js and npm registry access for install and publish steps.
      # cache is set only when a lock file exists; lock-less packages skip caching.
      # setup-node 의 packageManager 기반 자동 캐싱은 lock-less(npm install) 정책과
      # 충돌하므로 package-manager-cache 를 비활성화한다.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://registry.npmjs.org
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
          package-manager-cache: false

      # Validate the release tag and export TAG_VERSION (to GITHUB_ENV) for later steps.
      - name: Validate tag
        run: bash ./.shared/scripts/github/validate-tag.sh

      # Idempotency: if this version is already on npm, skip the remaining steps so a
      # re-pushed tag or re-dispatch cannot churn/overwrite an existing publish.
      - name: Check if already published
        id: published
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "${PKG_NAME}@${TAG_VERSION}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PKG_NAME}@${TAG_VERSION} is already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Install dependencies with npm install because lockfile policy may vary.
      - name: Install deps
        if: steps.published.outputs.exists != 'true'
        run: npm install

      # Ensure package.json version exactly matches the release tag version.
      - name: Check package.json version
        if: steps.published.outputs.exists != 'true'
        run: node ./.shared/scripts/node/verify-package-version.mjs

      # Rewrite exports paths so published package points at dist output.
      - name: Rewrite exports src -> dist
        if: steps.published.outputs.exists != 'true'
        run: node ./.shared/scripts/node/rewrite-exports-src-to-dist.mjs

      # Build the package before publishing it to npm.
      - name: Build
        if: steps.published.outputs.exists != 'true'
        run: npm run build

      # 빌드 산출물이 아니라 실제로 게시될 tarball 을 검사하기 위해 먼저 pack 한다.
      # 로컬 빌드와 files 글롭이 멀쩡해 보여도 tarball 에서 모듈이 빠질 수 있고, 그것을
      # 볼 수 있는 곳은 산출물을 손에 쥔 이 단계뿐이다. 스크립트가 PACKED_TARBALL·
      # PACKED_DIR 을 내보내며, 디렉터리 게시와 같은 lifecycle 순서를 유지한다.
      - name: Pack
        if: steps.published.outputs.exists != 'true'
        run: bash ./.shared/scripts/node/pack-for-publish.sh

      # 게시될 package.json 이 가리키는 모든 경로(main·module·types·browser·bin·
      # exports·imports, * 패턴 포함)가 tarball 안에 있는지 확인한다. caller 설정이 필요 없다.
      - name: Verify packed entry points
        if: steps.published.outputs.exists != 'true'
        run: node ./.shared/scripts/node/verify-packed-manifest.mjs

      # 패키지 고유 불변식(예: 소스가 등록하는 모듈이 dist 에도 남아 있는가)은 caller 가 가진다.
      # 입력을 run 에 직접 보간하지 않고 env 로 넘긴다 — 명령 문자열이 스텝 스크립트 텍스트가
      # 되지 않게. NPM_TOKEN 은 이 스텝에 없다.
      - name: Verify packed tarball (caller)
        if: steps.published.outputs.exists != 'true' && inputs.verify_command != ''
        env:
          VERIFY_COMMAND: ${{ inputs.verify_command }}
        run: bash -e -o pipefail -c "$VERIFY_COMMAND"

      # 검증한 tarball 을 그대로 게시한다 — 디렉터리를 다시 pack 하면 검증한 것과 게시되는
      # 것이 같다는 보장이 없다.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        run: npm publish "$PACKED_TARBALL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
